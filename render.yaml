services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js / Express)
  # ----------------------------------------------------------------------------
  - type: web
    name: dfc-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Customer Website (React / Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: dfc-customer-website
    env: static
    rootDir: customer-website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_RESTAURANT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------------------------
  # 3. Dashboard (React / Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: dfc-dashboard
    env: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------------------------
  # 4. Rider App (React / Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: dfc-rider
    env: static
    rootDir: rider
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
